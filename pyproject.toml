[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "randmac"
version = "0.2.0"
description = "randmac is a utility that generates 12-digit mac addresses"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Josh Schmelzle", email = "josh@joshschmelzle.com" }]
keywords = ["randmac", "random mac", "random mac address"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/joshschmelzle/randmac"
Repository = "https://github.com/joshschmelzle/randmac"
Changelog = "https://github.com/joshschmelzle/randmac/blob/main/HISTORY.md"
Issues = "https://github.com/joshschmelzle/randmac/issues"

[project.scripts]
randmac = "randmac.__main__:main"

[project.optional-dependencies]
build = ["build", "twine"]
dev = ["black", "bumpver", "isort", "mypy", "pytest"]

[tool.setuptools.packages.find]
include = ["randmac*"]

[tool.black]
target-version = ["py313"]

[tool.isort]
py_version = "313"

[tool.mypy]
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bumpver]
current_version = "0.2.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"randmac/__version__.py" = [
    '__version__ = "{version}"',
]
